<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Apex Power & Energy Solutions provides professional electrical audits, power quality studies, BEE certified energy audits, and industrial thermography inspections in Jaipur, India.">

  <title>Apex Power & Energy Solutions | Electrical Engineering & Energy Consulting</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Outfit (Headings) & Inter (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">

  <!-- Font Awesome Vector Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom Core Design System Stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Custom Cursor Elements -->
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <!-- Main Single Page Application Mounting Point -->
  <div id="app">
    <!-- Header, Router main views, and Footer will mount dynamically here -->
    <div
      style="display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:'Outfit',sans-serif; color:#003262;">
      <div style="text-align:center;">
        <i class="fa-solid fa-bolt-lightning fa-spin" style="font-size:3rem; margin-bottom:1.5rem; color:#FE6F5E;"></i>
        <h2>Loading Apex Power Solutions...</h2>
      </div>
    </div>
  </div>

  <!-- Custom Cursor Animation Script -->
  <script>
    (function () {
      const dot = document.getElementById('cursor-dot');
      const ring = document.getElementById('cursor-ring');

      // Ring lags behind with lerp
      let mouseX = -100, mouseY = -100;
      let ringX = -100, ringY = -100;
      const LERP = 0.13;

      // Move dot instantly
      document.addEventListener('mousemove', function (e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
        dot.style.transform = 'translate(' + (mouseX - 4) + 'px, ' + (mouseY - 4) + 'px)';
      });

      // Animate ring with smooth lag
      function animateRing() {
        ringX += (mouseX - ringX) * LERP;
        ringY += (mouseY - ringY) * LERP;
        ring.style.transform = 'translate(' + (ringX - 20) + 'px, ' + (ringY - 20) + 'px)';
        requestAnimationFrame(animateRing);
      }
      animateRing();

      // Expand ring on hover over interactive elements
      const TARGETS = 'a, button, [role="button"], input, select, textarea, label';
      document.addEventListener('mouseover', function (e) {
        if (e.target.closest(TARGETS)) {
          ring.classList.add('cursor-hover');
          dot.classList.add('cursor-hover');
        }
      });
      document.addEventListener('mouseout', function (e) {
        if (e.target.closest(TARGETS)) {
          ring.classList.remove('cursor-hover');
          dot.classList.remove('cursor-hover');
        }
      });

      // Hide cursors when mouse leaves window
      document.addEventListener('mouseleave', function () {
        dot.style.opacity = '0';
        ring.style.opacity = '0';
      });
      document.addEventListener('mouseenter', function () {
        dot.style.opacity = '1';
        ring.style.opacity = '1';
      });

      // Click pulse effect
      document.addEventListener('mousedown', function () { ring.classList.add('cursor-click'); });
      document.addEventListener('mouseup', function () { ring.classList.remove('cursor-click'); });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
