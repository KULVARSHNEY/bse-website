<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Enclosure Metal Gradients -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="enclosureDoor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Copper Coil Gradients -->
    <linearGradient id="copperCoil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="25%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <linearGradient id="copperHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </linearGradient>

    <!-- Iron Core Laminations -->
    <linearGradient id="coreSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="coreClamp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Gold Brass Bushings -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
    <filter id="glowAccent" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>
  
  <!-- Floor Shadow -->
  <ellipse cx="400" cy="525" rx="310" ry="25" fill="#0F172A" opacity="0.22" filter="blur(10px)"/>

  <!-- ==================== MAIN TRANSFORMER UNIT ==================== -->
  <g filter="url(#shadow)">
    <!-- Base Mounting Channel Frame -->
    <rect x="180" y="475" width="440" height="35" rx="4" fill="url(#panelGrad)"/>
    <circle cx="210" cy="492" r="7" fill="#0F172A"/>
    <circle cx="210" cy="492" r="4" fill="#94A3B8"/>
    <circle cx="590" cy="492" r="7" fill="#0F172A"/>
    <circle cx="590" cy="492" r="4" fill="#94A3B8"/>
    <rect x="195" y="478" width="410" height="4" fill="#64748B" opacity="0.5"/>

    <!-- Bottom Clamp Channel -->
    <rect x="210" y="445" width="380" height="32" rx="3" fill="url(#coreClamp)"/>
    <!-- Bottom Clamp Bolts -->
    <circle cx="240" cy="461" r="5" fill="#334155"/><circle cx="240" cy="461" r="3" fill="#E2E8F0"/>
    <circle cx="350" cy="461" r="5" fill="#334155"/><circle cx="350" cy="461" r="3" fill="#E2E8F0"/>
    <circle cx="450" cy="461" r="5" fill="#334155"/><circle cx="450" cy="461" r="3" fill="#E2E8F0"/>
    <circle cx="560" cy="461" r="5" fill="#334155"/><circle cx="560" cy="461" r="3" fill="#E2E8F0"/>

    <!-- Magnetic Silicon Steel Core Limbs (3-Phase CRGO Core) -->
    <!-- Center core limb backing -->
    <rect x="235" y="160" width="70" height="290" fill="url(#coreSteel)"/>
    <rect x="365" y="160" width="70" height="290" fill="url(#coreSteel)"/>
    <rect x="495" y="160" width="70" height="290" fill="url(#coreSteel)"/>

    <!-- Left Phase Coil (U / R Phase) -->
    <g id="coil-phase-r">
      <!-- Primary / Secondary Winding Block with insulation barrier -->
      <rect x="220" y="200" width="100" height="240" rx="8" fill="url(#copperCoil)"/>
      <rect x="225" y="202" width="20" height="236" fill="url(#copperHighlight)"/>
      <!-- Windings layer lines -->
      <path d="M220 220 h100 M220 240 h100 M220 260 h100 M220 280 h100 M220 300 h100 M220 320 h100 M220 340 h100 M220 360 h100 M220 380 h100 M220 400 h100 M220 420 h100" stroke="#78350F" stroke-width="2" opacity="0.6"/>
      <!-- Faraday Electrostatic Shield Barrier Line -->
      <line x1="270" y1="200" x2="270" y2="440" stroke="#E2E8F0" stroke-width="2.5" stroke-dasharray="4 3"/>
      <!-- Coil Top Collar -->
      <rect x="215" y="195" width="110" height="10" rx="3" fill="#92400E"/>
      <rect x="215" y="435" width="110" height="10" rx="3" fill="#92400E"/>
    </g>

    <!-- Center Phase Coil (V / Y Phase) -->
    <g id="coil-phase-y">
      <rect x="350" y="200" width="100" height="240" rx="8" fill="url(#copperCoil)"/>
      <rect x="355" y="202" width="20" height="236" fill="url(#copperHighlight)"/>
      <!-- Windings layer lines -->
      <path d="M350 220 h100 M350 240 h100 M350 260 h100 M350 280 h100 M350 300 h100 M350 320 h100 M350 340 h100 M350 360 h100 M350 380 h100 M350 400 h100 M350 420 h100" stroke="#78350F" stroke-width="2" opacity="0.6"/>
      <!-- Faraday Shield Barrier Line -->
      <line x1="400" y1="200" x2="400" y2="440" stroke="#E2E8F0" stroke-width="2.5" stroke-dasharray="4 3"/>
      <!-- Coil Collars -->
      <rect x="345" y="195" width="110" height="10" rx="3" fill="#92400E"/>
      <rect x="345" y="435" width="110" height="10" rx="3" fill="#92400E"/>
    </g>

    <!-- Right Phase Coil (W / B Phase) -->
    <g id="coil-phase-b">
      <rect x="480" y="200" width="100" height="240" rx="8" fill="url(#copperCoil)"/>
      <rect x="485" y="202" width="20" height="236" fill="url(#copperHighlight)"/>
      <!-- Windings layer lines -->
      <path d="M480 220 h100 M480 240 h100 M480 260 h100 M480 280 h100 M480 300 h100 M480 320 h100 M480 340 h100 M480 360 h100 M480 380 h100 M480 400 h100 M480 420 h100" stroke="#78350F" stroke-width="2" opacity="0.6"/>
      <!-- Faraday Shield Barrier Line -->
      <line x1="530" y1="200" x2="530" y2="440" stroke="#E2E8F0" stroke-width="2.5" stroke-dasharray="4 3"/>
      <!-- Coil Collars -->
      <rect x="475" y="195" width="110" height="10" rx="3" fill="#92400E"/>
      <rect x="475" y="435" width="110" height="10" rx="3" fill="#92400E"/>
    </g>

    <!-- Top Core Clamp Channel -->
    <rect x="210" y="155" width="380" height="35" rx="3" fill="url(#coreClamp)"/>
    <!-- Top Clamp Bolts & Tie-Rods -->
    <circle cx="240" cy="172" r="5" fill="#334155"/><circle cx="240" cy="172" r="3" fill="#E2E8F0"/>
    <circle cx="350" cy="172" r="5" fill="#334155"/><circle cx="350" cy="172" r="3" fill="#E2E8F0"/>
    <circle cx="450" cy="172" r="5" fill="#334155"/><circle cx="450" cy="172" r="3" fill="#E2E8F0"/>
    <circle cx="560" cy="172" r="5" fill="#334155"/><circle cx="560" cy="172" r="3" fill="#E2E8F0"/>

    <!-- Vertical Tension Rods -->
    <rect x="214" y="190" width="4" height="255" fill="url(#brassGrad)"/>
    <rect x="582" y="190" width="4" height="255" fill="url(#brassGrad)"/>

    <!-- Lifting Lugs on Top Frame -->
    <path d="M260 155 C260 125, 290 125, 290 155 Z" fill="url(#panelGrad)" stroke="#64748B" stroke-width="2"/>
    <circle cx="275" cy="142" r="7" fill="#F1F5F9"/>
    
    <path d="M510 155 C510 125, 540 125, 540 155 Z" fill="url(#panelGrad)" stroke="#64748B" stroke-width="2"/>
    <circle cx="525" cy="142" r="7" fill="#F1F5F9"/>

    <!-- Terminal Stand & High Conductivity Busbar Terminals -->
    <!-- Primary Terminals (Top Left - Red, Yellow, Blue) -->
    <g id="terminals-primary">
      <!-- Terminal support block -->
      <rect x="235" y="110" width="110" height="15" rx="3" fill="#0F172A"/>
      <!-- Red Phase 1U -->
      <rect x="245" y="85" width="14" height="30" fill="url(#brassGrad)"/>
      <circle cx="252" cy="88" r="4" fill="#DC2626"/>
      <text x="252" y="76" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">1U</text>

      <!-- Yellow Phase 1V -->
      <rect x="283" y="85" width="14" height="30" fill="url(#brassGrad)"/>
      <circle cx="290" cy="88" r="4" fill="#EAB308"/>
      <text x="290" y="76" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#CA8A04" text-anchor="middle">1V</text>

      <!-- Blue Phase 1W -->
      <rect x="321" y="85" width="14" height="30" fill="url(#brassGrad)"/>
      <circle cx="328" cy="88" r="4" fill="#2563EB"/>
      <text x="328" y="76" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">1W</text>
    </g>

    <!-- Secondary Isolated Terminals (Top Right - 2U, 2V, 2W, 2N Isolated Clean Neutral) -->
    <g id="terminals-secondary">
      <rect x="440" y="110" width="145" height="15" rx="3" fill="#0F172A"/>
      <!-- 2U -->
      <rect x="450" y="85" width="14" height="30" fill="url(#brassGrad)"/>
      <circle cx="457" cy="88" r="4" fill="#DC2626"/>
      <text x="457" y="76" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">2U</text>

      <!-- 2V -->
      <rect x="485" y="85" width="14" height="30" fill="url(#brassGrad)"/>
      <circle cx="492" cy="88" r="4" fill="#EAB308"/>
      <text x="492" y="76" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#CA8A04" text-anchor="middle">2V</text>

      <!-- 2W -->
      <rect x="520" y="85" width="14" height="30" fill="url(#brassGrad)"/>
      <circle cx="527" cy="88" r="4" fill="#2563EB"/>
      <text x="527" y="76" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#2563EB" text-anchor="middle">2W</text>

      <!-- 2N Isolated Ground Reference Neutral -->
      <rect x="555" y="85" width="14" height="30" fill="url(#brassGrad)"/>
      <circle cx="562" cy="88" r="4" fill="#000000"/>
      <text x="562" y="76" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">2N</text>
    </g>

    <!-- Ground / Earth & Shield Ground Terminals -->
    <rect x="215" y="476" width="30" height="8" rx="2" fill="#16A34A"/>
    <text x="230" y="470" font-family="'Outfit', sans-serif" font-size="9" font-weight="700" fill="#16A34A" text-anchor="middle">SHIELD PE</text>
  </g>

  <!-- Industrial Rating Nameplate Banner -->
  <g transform="translate(400, 310)">
    <rect x="-135" y="-30" width="270" height="60" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
    <text x="0" y="-10" font-family="'Outfit', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ISOLATION TRANSFORMER</text>
    <text x="0" y="10" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">Rating: 1 kVA to As Required</text>
    <text x="0" y="24" font-family="'Outfit', sans-serif" font-size="9" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="0.5">GALVANIC ISOLATION • ELECTROSTATIC SHIELD</text>
  </g>

  <!-- Technical Feature Floating Badges -->
  <!-- Top Left Badge: Galvanic Isolation -->
  <g transform="translate(130, 160)" filter="url(#shadow)">
    <rect x="-70" y="-22" width="140" height="44" rx="22" fill="#FFFFFF" stroke="#003262" stroke-width="2"/>
    <circle cx="-45" cy="0" r="14" fill="#003262"/>
    <path d="M-50 -5 L-45 2 L-40 -5 M-50 5 L-40 5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="15" y="-3" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#003262" text-anchor="middle">Galvanic</text>
    <text x="15" y="11" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#64748B" text-anchor="middle">Isolation</text>
  </g>

  <!-- Top Right Badge: 1 kVA to Custom -->
  <g transform="translate(670, 160)" filter="url(#shadow)">
    <rect x="-75" y="-22" width="150" height="44" rx="22" fill="#FFFFFF" stroke="#FE6F5E" stroke-width="2"/>
    <circle cx="-50" cy="0" r="14" fill="#FE6F5E"/>
    <text x="-50" y="4" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">kVA</text>
    <text x="15" y="-3" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">1 kVA to Custom</text>
    <text x="15" y="11" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#FE6F5E" text-anchor="middle">As Per Required</text>
  </g>

  <!-- Bottom Left Badge: Noise Attenuation -->
  <g transform="translate(130, 420)" filter="url(#shadow)">
    <rect x="-75" y="-22" width="150" height="44" rx="22" fill="#FFFFFF" stroke="#6B00D7" stroke-width="2"/>
    <circle cx="-50" cy="0" r="14" fill="#6B00D7"/>
    <path d="M-54 -4 Q-50 4 -46 -4 T-42 -4" stroke="#FFFFFF" stroke-width="2" fill="none"/>
    <text x="18" y="-3" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Noise &amp; Surge</text>
    <text x="18" y="11" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#6B00D7" text-anchor="middle">Suppression</text>
  </g>

  <!-- Bottom Right Badge: Class H / VPI -->
  <g transform="translate(670, 420)" filter="url(#shadow)">
    <rect x="-70" y="-22" width="140" height="44" rx="22" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <circle cx="-45" cy="0" r="14" fill="#059669"/>
    <path d="M-50 0 L-46 5 L-40 -4" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="15" y="-3" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Class H / VPI</text>
    <text x="15" y="11" font-family="'Outfit', sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">IEC 61558-2-4</text>
  </g>
</svg>
